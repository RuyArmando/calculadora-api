<form [formGroup]="form" (ngSubmit)="consultar()">
    <div class="rtc-grid rtc-elevacao-1 rtc-margin-top-20 rtc-margin-bottom-10 rtc-padding-10">
        <div class="rtc-grid-item-4">
            <br-date-picker #datePicker label="Ocorrência" formControlName="dataControl"
                (ngModelChange)="dataControlChange($event)" (input)="dataControlInputChange($event)" [required]="true">
            </br-date-picker>
        </div>
        <div class="rtc-grid-item-4">
            <br-select class="select" [required]="false" name="estado" label="Estado" [values]="estadoValues"
                itemLabel="nome" (ngModelChange)="estadoControlChange($event)" formControlName="estadoControl"
                appendTo="body" [clearable]="false">
            </br-select>
        </div>
        <div class="rtc-grid-item-4">
            <br-select class="select" [required]="false" name="municipio" label="Município" [values]="municipioValues"
                itemLabel="nome" (ngModelChange)="municipioControlChange($event)" formControlName="municipioControl"
                appendTo="body" [clearable]="false">
            </br-select>
        </div>
    </div>
    <div class="rtc-grid">
        <div class="rtc-grid-item-12 rtc-text-align-right">
            <button type="submit" class="br-button primary rtc-margin-10">
                <span><i class="fa-solid fa-search"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Consultar</span>
            </button>
        </div>
    </div>
    <div *ngIf="response != null" class="rtc-grid rtc-elevacao-1 rtc-padding-10 rtc-margin-top-10">
        <div class="rtc-grid-item-12">
            <consultar-aliquotas-resultado [dados]="response"></consultar-aliquotas-resultado>
        </div>
    </div>
</form>
