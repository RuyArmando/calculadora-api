<form [formGroup]="form">
    <div>
        <my-title
            [titulo]="'Bases de Cálculo'"
            [descricao]="'Simule o valor da base de cálculo nas operações de consumo de bens e serviços.'">
        </my-title>
    </div>
    <div class="rtc-grid rtc-padding-10">
        <div class="rtc-grid-item-4">
            <br-select [required]="false" name="opcaoControl" label="Tributo"
                [values]="opcaoValues" itemLabel="label" formControlName="opcaoControl" appendTo=""
                [clearable]="false" [searchable]="false">
            </br-select>
        </div>
    </div>
    <div class="rtc-grid rtc-padding-10 rtc-margin-bottom-10">
        <div class="rtc-grid-item-12">
            <simulador-base-calculo-cbs-ibs-mercadorias *ngIf="opcao == 1"></simulador-base-calculo-cbs-ibs-mercadorias>
            <simulador-base-calculo-is-mercadorias *ngIf="opcao == 3"></simulador-base-calculo-is-mercadorias>
        </div>
    </div>
</form>
